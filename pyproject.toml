[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]
ignore = ["B008"]  # FastAPI's Depends() in defaults is the intended pattern

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "E402"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

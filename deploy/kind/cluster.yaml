# Local single-node kind cluster. NodePorts are published on 127.0.0.1 only,
# so nothing is exposed beyond this machine.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: todo
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080   # todo app (Service type NodePort)
        hostPort: 8080
        listenAddress: 127.0.0.1
      - containerPort: 30300   # Grafana
        hostPort: 3000
        listenAddress: 127.0.0.1
      - containerPort: 30090   # Prometheus
        hostPort: 9090
        listenAddress: 127.0.0.1
      - containerPort: 30093   # Alertmanager
        hostPort: 9093
        listenAddress: 127.0.0.1
      - containerPort: 30686   # Jaeger UI
        hostPort: 16686
        listenAddress: 127.0.0.1

{{- if .Values.serviceAccount.create }}
# The app never talks to the Kubernetes API, so its identity has no RBAC
# bindings and no token is mounted into the pod.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "todo-app.serviceAccountName" . }}
  labels:
    {{- include "todo-app.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "todo-app.postgresName" . }}
  labels:
    {{- include "todo-app.labels" . | nindent 4 }}
automountServiceAccountToken: false

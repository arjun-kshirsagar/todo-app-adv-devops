# `helm test <release>`: exercises the real user path through the Service
# (create -> read -> complete -> delete) from inside the cluster.
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "todo-app.fullname" . }}-test-journey
  labels:
    {{- include "todo-app.labels" . | nindent 4 }}
    # Selected by the test-only egress NetworkPolicy below.
    app.kubernetes.io/component: test
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: journey
      image: "{{ .Values.image.repository }}:{{ include "todo-app.imageTag" . }}"
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 200m
          memory: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      env:
        - name: BASE
          value: "http://{{ include "todo-app.fullname" . }}:{{ .Values.service.port }}"
      command:
        - python
        - -c
        - |
          import json, os, urllib.request as u
          base = os.environ["BASE"]
          def call(method, path, body=None):
              data = json.dumps(body).encode() if body is not None else None
              req = u.Request(base + path, data=data, method=method,
                              headers={"Content-Type": "application/json"})
              with u.urlopen(req, timeout=5) as r:
                  raw = r.read()
                  return r.status, (json.loads(raw) if raw else None)
          s, v = call("GET", "/version"); print("version", v); assert s == 200
          s, t = call("POST", "/api/todos", {"title": "helm-test"}); assert s == 201
          s, t2 = call("PATCH", f"/api/todos/{t['id']}", {"done": True}); assert t2["done"] is True
          s, items = call("GET", "/api/todos"); assert any(i["id"] == t["id"] for i in items)
          s, _ = call("DELETE", f"/api/todos/{t['id']}"); assert s == 204
          print("user journey OK")
